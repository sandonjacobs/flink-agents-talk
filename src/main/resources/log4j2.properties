rootLogger.level = WARN
rootLogger.appenderRef.console.ref = Console

logger.app.name = io.sandonjacobs.ato
logger.app.level = INFO

appender.console.type = Console
appender.console.name = Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %-5p %c{1} - %m%n

# Set to INFO to see every agent event (input, chat request/response, tool calls, output) as JSON.
logger.agents.name = org.apache.flink.agents
logger.agents.level = WARN

# Quiet known-harmless startup noise from the local MiniCluster.
logger.webmon.name = org.apache.flink.runtime.webmonitor.WebMonitorUtils
logger.webmon.level = ERROR
logger.tokens.name = org.apache.flink.runtime.security.token
logger.tokens.level = ERROR
logger.metrics.name = org.apache.flink.metrics.MetricGroup
logger.metrics.level = ERROR
logger.metrics2.name = org.apache.flink.runtime.metrics.groups
logger.metrics2.level = ERROR
